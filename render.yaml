# Free deployment: Render web service + a free Postgres (e.g. Neon) via DATABASE_URL.
services:
  - type: web
    name: shop-api
    runtime: python
    plan: free          # without this line Render assumes a paid plan and asks for a card
    buildCommand: ./build.sh
    startCommand: gunicorn ecommerce.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com        # any *.onrender.com name Render gives you
      - key: CORS_ALLOWED_ORIGINS
        value: https://django-ecommerce-theta.vercel.app   # your Vercel origin, no trailing slash. Render re-applies this on every deploy
      - key: DATABASE_URL
        sync: false   # paste your Postgres connection string in the Render dashboard
      - key: PAYMENT_PROVIDER
        value: mock
      - key: WEBHOOK_SECRET
        generateValue: true     # shared secret for signing/verifying payment webhooks
      # --- dashboard admin (created on every deploy by `manage.py ensure_admin`) ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- links inside emails point here; set it to your Vercel URL ---
      - key: FRONTEND_URL
        sync: false
      # --- optional real email delivery (otherwise emails are printed to the Render log) ---
      # EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend, EMAIL_HOST, EMAIL_PORT,
      # EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL
