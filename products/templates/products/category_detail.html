{% extends 'base.html' %}

{% block content %}
  <h2>{{ category.name }}</h2>

  {% for product in products %}
    <div>
      <h3><a href="{% url 'product_detail' product.slug %}">{{ product.name }}</a></h3>
      <p>₹{{ product.price }}</p>
    </div>
  {% empty %}
    <p>No products found</p>
  {% endfor %}
{% endblock %}
