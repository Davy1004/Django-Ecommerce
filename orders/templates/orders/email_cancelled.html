<div style="font-family:Arial,sans-serif;max-width:560px;margin:auto;color:#1a1208">
  <h2 style="color:#c8873a;margin-bottom:4px">{{ shop }}</h2>
  <h3 style="margin-top:0">Order #{{ order.pk }} was cancelled</h3>
  <p>Nothing was charged and the items are back in stock.</p>
  <ul>{% for i in items %}<li>{{ i.product_name }} &times; {{ i.quantity }}</li>{% endfor %}</ul>
  <p><a href="{{ order_url }}" style="background:#c8873a;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none">View order</a></p>
</div>
